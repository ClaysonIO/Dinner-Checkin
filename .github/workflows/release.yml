name: Release APK

# Run from the Actions tab ("Run workflow") with a new tag such as v1.1.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk dinner-checkin.apk
          gh release create "$TAG" dinner-checkin.apk \
            --target "$GITHUB_SHA" \
            --title "Dinner Check-in $TAG" \
            --notes "Download dinner-checkin.apk on your Android phone and open it to install (allow installs from your browser if asked)."
